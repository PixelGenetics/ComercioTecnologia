# Despliegue en Netlify (https://app.netlify.com → Add new site → Import from GitHub)
[build]
  command = "npm run build"
  publish = "dist/tienda-web/browser"

[build.environment]
  # Angular 22 requiere Node ^22.22.3 o ^24.15.0
  NODE_VERSION = "24"

# SPA: cualquier ruta (/catalogo, /pedidos/2…) la resuelve Angular desde index.html.
# Los archivos que existen (JS, CSS, imágenes) se sirven normalmente.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Caché larga para los archivos con hash en el nombre; index.html siempre fresco
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
